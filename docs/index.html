<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mailsync</title>
<style>
  :root {
    --bg: #ffffff; --panel: #f6f8fa; --fg: #1f2328; --muted: #59636e; --line: #d1d9e0;
    --accent: #0969da; --accent-soft: #ddf4ff; --warn-bg: #fff8c5; --warn-line: #d4a72c;
    --code-bg: #f6f8fa; --danger: #cf222e; --ok: #1a7f37;
    --sidebar: 248px; --topbar: 52px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --panel: #151b23; --fg: #e6edf3; --muted: #9198a1; --line: #3d444d;
      --accent: #4493f8; --accent-soft: #121d2f; --warn-bg: #282215; --warn-line: #9e6a03;
      --code-bg: #151b23; --danger: #f85149; --ok: #3fb950;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg); overflow: hidden;
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  a { color: var(--accent); }

  /* ---- top bar ---- */
  #topbar {
    height: var(--topbar); border-bottom: 1px solid var(--line); background: var(--panel);
    display: flex; align-items: center; gap: 1rem; padding: 0 1rem; position: relative; z-index: 2;
  }
  #topbar .brand { font-weight: 600; font-size: 1.05rem; }
  #topbar .brand small { font-weight: 400; color: var(--muted); margin-left: .5rem; font-size: .8rem; }
  #topbar .spacer { flex: 1; }
  .chip { font-size: .8rem; padding: .2rem .55rem; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap; }
  .chip.ok { color: var(--ok); border-color: var(--ok); }
  .chip.bad { color: var(--danger); border-color: var(--danger); }
  #lang-select {
    width: auto; padding: .28rem 1.6rem .28rem .5rem; font-size: .85rem; cursor: pointer;
    border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg);
    appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%),
                      linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 15px) 52%, calc(100% - 10px) 52%;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
  }

  /* ---- layout ---- */
  #shell { display: flex; height: calc(100% - var(--topbar)); }
  #sidebar {
    width: var(--sidebar); flex: none; border-right: 1px solid var(--line);
    background: var(--panel); overflow-y: auto; padding: .75rem .5rem 1.5rem;
  }
  #main { flex: 1; overflow-y: auto; padding: 1.25rem 1.5rem 3rem; }
  #main-inner { max-width: 760px; }

  .side-title {
    font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
    padding: .75rem .6rem .3rem; font-weight: 600;
  }
  .side-item {
    display: flex; align-items: center; gap: .5rem; width: 100%; text-align: left;
    border: none; background: none; color: var(--fg); font: inherit; font-size: .88rem;
    padding: .4rem .6rem; border-radius: 6px; cursor: pointer;
  }
  .side-item:hover { background: var(--bg); }
  .side-item[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .side-item .grow { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--danger); flex: none; }
  .side-item.add { color: var(--accent); }
  .side-sep { height: 1px; background: var(--line); margin: .6rem .6rem; }

  /* ---- forms ---- */
  h2 { font-size: 1.2rem; margin: 0 0 .25rem; }
  h3 { font-size: .72rem; margin: 1.5rem 0 .6rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  p.sub { color: var(--muted); margin: 0 0 1.25rem; font-size: .88rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: .7rem .9rem; }
  label { display: block; font-size: .78rem; color: var(--muted); margin-bottom: .2rem; }
  input[type=text], input[type=number], select, textarea {
    width: 100%; padding: .42rem .55rem; border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg); color: var(--fg); font-size: .9rem; font-family: inherit;
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  textarea { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .82rem; min-height: 220px; resize: vertical; }
  button.btn {
    font: inherit; font-size: .85rem; padding: .35rem .8rem; border-radius: 6px;
    border: 1px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer;
  }
  button.btn:hover { border-color: var(--accent); }
  button.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.icon { border: none; background: none; color: var(--danger); cursor: pointer; padding: .2rem .35rem; font-size: .9rem; }
  .row { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
  .folder-row { display: grid; grid-template-columns: 1fr auto 1fr auto; gap: .5rem; align-items: center; margin-bottom: .45rem; }
  .folder-row .arrow { color: var(--muted); }
  .radios { display: flex; gap: 1rem; flex-wrap: wrap; font-size: .85rem; }
  .radios label { display: inline-flex; align-items: center; gap: .3rem; margin: 0; color: var(--fg); }
  .hint { font-size: .76rem; color: var(--muted); margin-top: .2rem; }
  .notice {
    background: var(--warn-bg); border: 1px solid var(--warn-line); border-radius: 6px;
    padding: .6rem .8rem; margin-bottom: 1.25rem; font-size: .82rem;
  }
  .notice strong { display: block; margin-bottom: .15rem; }
  pre {
    background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px;
    padding: .9rem; overflow: auto; font-size: .82rem; line-height: 1.5; margin: 0;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .errors { color: var(--danger); font-size: .85rem; margin-bottom: 1rem; }
  .errors ul { margin: .25rem 0 0; padding-left: 1.2rem; }
  .out-head { display: flex; justify-content: space-between; align-items: center; gap: .5rem; margin-bottom: .6rem; flex-wrap: wrap; }
  footer { margin-top: 2rem; padding-top: .9rem; border-top: 1px solid var(--line); color: var(--muted); font-size: .8rem; }
  [hidden] { display: none !important; }

  @media (max-width: 720px) {
    body { overflow: auto; }
    #shell { display: block; height: auto; }
    #sidebar { width: auto; border-right: none; border-bottom: 1px solid var(--line); }
    #main { padding: 1rem; }
  }
</style>
</head>
<body>
<div id="topbar">
  <span class="brand">mailsync<small id="brand-sub"></small></span>
  <span class="spacer"></span>
  <span id="status-chip" class="chip"></span>
  <select id="lang-select" aria-label="Idioma / Language">
    <option value="es">🇪🇸 Español</option>
    <option value="en">🇬🇧 English</option>
  </select>
</div>

<div id="shell">
  <nav id="sidebar"></nav>
  <div id="main"><div id="main-inner"></div></div>
</div>

<input type="file" id="file-input" accept=".yaml,.yml,.txt,text/plain" hidden>

<!-- The ?v= query busts the CDN cache: GitHub Pages serves assets for a
     while, and a stale script against fresh markup breaks the page. Bump it
     whenever these files change. -->
<script src="config.js?v=3"></script>
<script src="strings.js?v=3"></script>
<script src="app.js?v=3"></script>
</body>
</html>
