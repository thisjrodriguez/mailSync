<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mailsync</title>
<style>
  :root {
    --bg: #ffffff; --panel: #fbfcfd; --card: #ffffff; --fg: #1f2328; --muted: #656d76;
    --line: #d8dee4; --line-soft: #eaeef2;
    --accent: #0969da; --accent-soft: #eaf2fd; --accent-line: #b6d7fb;
    --danger: #cf222e; --danger-soft: #fff0ef; --ok: #1a7f37; --ok-soft: #eaf6ec;
    --code-bg: #f6f8fa;
    --shadow: 0 1px 2px rgba(31, 35, 40, .06), 0 1px 1px rgba(31, 35, 40, .04);
    --sidebar: 236px; --topbar: 54px; --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --panel: #10151c; --card: #151b23; --fg: #e6edf3; --muted: #9198a1;
      --line: #3d444d; --line-soft: #262c36;
      --accent: #4493f8; --accent-soft: #10243e; --accent-line: #1f4b7f;
      --danger: #f85149; --danger-soft: #2d1416; --ok: #3fb950; --ok-soft: #12261a;
      --code-bg: #0d1117;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg); overflow: hidden;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* ---------- top bar ---------- */
  #topbar {
    height: var(--topbar); border-bottom: 1px solid var(--line-soft); background: var(--panel);
    display: flex; align-items: center; gap: .75rem; padding: 0 1.15rem; position: relative; z-index: 3;
  }
  .brand { font-weight: 650; font-size: 1.02rem; letter-spacing: -.01em; }
  .brand small { font-weight: 400; color: var(--muted); margin-left: .5rem; font-size: .8rem; letter-spacing: 0; }
  .spacer { flex: 1; }
  .chip {
    font-size: .78rem; font-weight: 500; padding: .22rem .6rem; border-radius: 999px;
    border: 1px solid transparent; white-space: nowrap;
  }
  .chip.ok { color: var(--ok); background: var(--ok-soft); border-color: transparent; }
  .chip.bad { color: var(--danger); background: var(--danger-soft); }
  #lang-select {
    width: auto; padding: .3rem 1.75rem .3rem .6rem; font-size: .84rem; cursor: pointer;
    border: 1px solid var(--line); border-radius: 7px; background-color: var(--bg); color: var(--fg);
    appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%),
                      linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 15px) 53%, calc(100% - 10px) 53%;
    background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
  }
  #lang-select:hover { border-color: var(--muted); }

  /* ---------- layout ---------- */
  #shell { display: flex; height: calc(100% - var(--topbar)); }
  #sidebar {
    width: var(--sidebar); flex: none; border-right: 1px solid var(--line-soft);
    background: var(--panel); overflow-y: auto; padding: .65rem .55rem 2rem;
  }
  #main { flex: 1; overflow-y: auto; padding: 1.75rem 2rem 4rem; }
  #main-inner { max-width: 720px; margin: 0 auto; }

  .side-title {
    font-size: .68rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted);
    padding: .9rem .65rem .35rem; font-weight: 600;
  }
  .side-item {
    display: flex; align-items: center; gap: .5rem; width: 100%; text-align: left;
    border: none; background: none; color: var(--fg); font: inherit; font-size: .875rem;
    padding: .42rem .65rem; border-radius: 7px; cursor: pointer; margin-bottom: 1px;
  }
  .side-item:hover { background: var(--line-soft); }
  .side-item[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .side-item .grow { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--danger); flex: none; }
  .side-item.add { color: var(--accent); font-weight: 500; }
  .side-sep { height: 1px; background: var(--line-soft); margin: .55rem .65rem; }

  /* ---------- page header ---------- */
  .page-head { display: flex; align-items: center; gap: .75rem; margin-bottom: 1.4rem; }
  .page-head h2 { font-size: 1.32rem; margin: 0; letter-spacing: -.02em; flex: 1; }
  .page-sub { color: var(--muted); font-size: .87rem; margin: -1rem 0 1.4rem; }

  /* ---------- cards ---------- */
  .section {
    background: var(--card); border: 1px solid var(--line-soft); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 1.1rem 1.15rem 1.2rem; margin-bottom: 1rem;
  }
  .section-head {
    display: flex; align-items: center; gap: .5rem; margin: 0 0 .9rem;
    font-size: .74rem; font-weight: 650; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
  }
  .section-head .badge {
    font-size: .68rem; font-weight: 600; letter-spacing: .02em; text-transform: none;
    padding: .1rem .45rem; border-radius: 5px; background: var(--line-soft); color: var(--muted);
  }

  /* ---------- fields ---------- */
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: .85rem .9rem; }
  .grid + .grid, .grid + .field-block { margin-top: .85rem; }
  label { display: block; font-size: .78rem; font-weight: 500; color: var(--muted); margin-bottom: .28rem; }
  input[type=text], input[type=number], input[type=password], select, textarea {
    width: 100%; height: 34px; padding: 0 .6rem; border: 1px solid var(--line); border-radius: 7px;
    background: var(--bg); color: var(--fg); font-size: .9rem; font-family: inherit;
  }
  select { cursor: pointer; }
  textarea { height: auto; padding: .6rem; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .82rem; min-height: 240px; resize: vertical; }
  input:focus, select:focus, textarea:focus {
    outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
  }
  input::placeholder { color: var(--muted); opacity: .6; }
  .hint { font-size: .76rem; color: var(--muted); margin-top: .3rem; line-height: 1.45; }

  /* password field with the eye inside */
  .pw-wrap { position: relative; }
  .pw-wrap input { padding-right: 2.3rem; }
  .pw-toggle {
    position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
    border: none; background: none; color: var(--muted); cursor: pointer; border-radius: 6px; padding: 0;
  }
  .pw-toggle:hover { color: var(--fg); background: var(--line-soft); }
  .pw-toggle svg { width: 16px; height: 16px; display: block; }

  /* ---------- radios ---------- */
  .radios { display: flex; gap: .4rem; flex-wrap: wrap; }
  .radios label {
    display: inline-flex; align-items: center; gap: .4rem; margin: 0; cursor: pointer;
    font-size: .83rem; font-weight: 500; color: var(--fg);
    border: 1px solid var(--line); border-radius: 7px; padding: .3rem .6rem;
  }
  .radios label:hover { border-color: var(--muted); }
  .radios label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .radios input { accent-color: var(--accent); margin: 0; }

  /* ---------- folders ---------- */
  .folder-row { display: grid; grid-template-columns: 1fr 18px 1fr 30px; gap: .5rem; align-items: center; margin-bottom: .5rem; }
  .folder-row .arrow { color: var(--muted); text-align: center; font-size: .9rem; }
  .icon-btn {
    border: none; background: none; color: var(--muted); cursor: pointer; border-radius: 6px;
    width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .icon-btn:hover { color: var(--danger); background: var(--danger-soft); }
  .icon-btn svg { width: 15px; height: 15px; }

  /* ---------- buttons ---------- */
  button.btn {
    font: inherit; font-size: .85rem; font-weight: 500; height: 32px; padding: 0 .85rem;
    border-radius: 7px; border: 1px solid var(--line); background: var(--bg); color: var(--fg);
    cursor: pointer; display: inline-flex; align-items: center; gap: .4rem;
  }
  button.btn:hover { border-color: var(--muted); background: var(--line-soft); }
  button.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.btn.primary:hover { filter: brightness(1.08); }
  .row { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }

  /* ---------- output ---------- */
  pre {
    background: var(--code-bg); border: 1px solid var(--line-soft); border-radius: var(--radius);
    padding: 1rem 1.1rem; overflow: auto; font-size: .82rem; line-height: 1.6; margin: 0;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .errors {
    background: var(--danger-soft); border: 1px solid transparent; border-radius: var(--radius);
    color: var(--danger); font-size: .84rem; padding: .8rem 1rem; margin-bottom: 1rem;
  }
  .errors strong { display: block; margin-bottom: .3rem; font-size: .8rem; }
  .errors ul { margin: 0; padding-left: 1.15rem; }
  .errors li { margin-bottom: .15rem; }

  footer { margin-top: 2.5rem; padding-top: 1rem; border-top: 1px solid var(--line-soft); color: var(--muted); font-size: .8rem; }
  footer div + div { margin-top: .2rem; }
  [hidden] { display: none !important; }

  @media (max-width: 760px) {
    body { overflow: auto; }
    #shell { display: block; height: auto; }
    #sidebar { width: auto; border-right: none; border-bottom: 1px solid var(--line-soft); }
    #main { padding: 1.1rem; }
  }
</style>
</head>
<body>
<div id="topbar">
  <span class="brand">mailsync<small id="brand-sub"></small></span>
  <span class="spacer"></span>
  <span id="status-chip" class="chip"></span>
  <select id="lang-select" aria-label="Idioma / Language">
    <option value="es">🇪🇸 Español</option>
    <option value="en">🇬🇧 English</option>
  </select>
</div>

<div id="shell">
  <nav id="sidebar"></nav>
  <div id="main"><div id="main-inner"></div></div>
</div>

<input type="file" id="file-input" accept=".yaml,.yml,.txt,text/plain" hidden>

<!-- The ?v= query busts the CDN cache: GitHub Pages serves assets for a
     while, and a stale script against fresh markup breaks the page. Bump it
     whenever these files change. -->
<script src="config.js?v=8"></script>
<script src="strings.js?v=8"></script>
<script src="app.js?v=8"></script>
</body>
</html>
